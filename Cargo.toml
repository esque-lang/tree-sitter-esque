[package]
name = "tree-sitter-esque"
description = "Esque grammar for tree-sitter"
# Not policed against the git tag — see README "Distribution" and
# https://github.com/esque-lang/tree-sitter-esque/issues/3.
version = "0.0.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "esque"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/esque-lang/tree-sitter-esque"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = ">=0.22.6"

[build-dependencies]
cc = "1.0.87"
